name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Manual re-run from the Actions tab, e.g. to refresh the changelog page
  # (rendered at build time from Blockwork's CHANGELOG.md) after a release,
  # or to pick up editor changes from the Blockwork and blockstitch repos.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The home page's live editor is Blockwork's own Qt editor built for the
  # browser (qt-demo/). These pick the sources it's built from.
  BLOCKWORK_REF: qml
  BLOCKSTITCH_REF: qml
  LUCIDE_QT_REF: main
  QT_VERSION: 6.12.0
  # The Emscripten version that Qt build was made with (QT_EMCC_RECOMMENDED_VERSION).
  EMSDK_VERSION: 5.0.5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout the editor's sources
        run: |
          for repo in "Blockwork:$BLOCKWORK_REF" "blockstitch:$BLOCKSTITCH_REF" "lucide-qt:$LUCIDE_QT_REF"; do
            git clone --depth 1 --branch "${repo#*:}" "https://github.com/Blockworked/${repo%%:*}.git" "qt-demo/deps/${repo%%:*}"
          done

      - name: Cache Qt and Emscripten
        uses: actions/cache@v4
        with:
          path: |
            ~/Qt
            ~/emsdk
          key: qt-${{ env.QT_VERSION }}-emsdk-${{ env.EMSDK_VERSION }}

      - name: Install Qt for WebAssembly
        run: |
          sudo apt-get install -y ninja-build
          if [ ! -d ~/Qt/$QT_VERSION/wasm_singlethread ]; then
            pip install aqtinstall
            # A desktop Qt of the same version supplies the host tools.
            aqt install-qt linux desktop $QT_VERSION linux_gcc_64 -O ~/Qt
            aqt install-qt all_os wasm $QT_VERSION wasm_singlethread -O ~/Qt
          fi
          if [ ! -d ~/emsdk ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
            ~/emsdk/emsdk install $EMSDK_VERSION
            ~/emsdk/emsdk activate $EMSDK_VERSION
          fi

      - name: Build the editor
        run: qt-demo/build.sh
        env:
          QT_WASM: /home/runner/Qt/${{ env.QT_VERSION }}/wasm_singlethread
          QT_HOST_PATH: /home/runner/Qt/${{ env.QT_VERSION }}/gcc_64
          EMSDK: /home/runner/emsdk
          BLOCKWORK_DIR: qt-demo/deps/Blockwork
          BLOCKSTITCH_DIR: qt-demo/deps/blockstitch
          LUCIDE_QT_DIR: qt-demo/deps/lucide-qt

      # Installs the pnpm version pinned in package.json's `packageManager`,
      # runs `pnpm run build` (astro check && astro build), and uploads dist/
      # (public/demo/ included).
      - name: Build
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
