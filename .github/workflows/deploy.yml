name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Manual re-run from the Actions tab, e.g. to refresh the changelog page
  # (rendered at build time from Blockwork's CHANGELOG.md) after a release.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json's `packageManager`,
      # runs `pnpm run build` (astro check && astro build), and uploads dist/.
      - name: Build
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
